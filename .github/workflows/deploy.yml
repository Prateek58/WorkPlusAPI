name: Deploy Backend API to CloudPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into server and deploy .NET API
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SITE_USER }}
          password: ${{ secrets.SSH_PASSWORD  }}
          port: 22
          script: |
            # Navigate to the backend site directory on CloudPanel
            if [ -d "~/htdocs/api.workplus.layerbiz.com/WorkPlusAPI/.git" ]; then
              cd ~/htdocs/api.workplus.layerbiz.com/WorkPlusAPI
            else
              cd ~/htdocs/api.workplus.layerbiz.com
            fi
            
            # Pull latest changes from main branch
            git pull origin main
            
            # Find and publish .NET 8 API project
            if [ -f "WorkPlusAPI/WorkPlusAPI.csproj" ]; then
              dotnet publish WorkPlusAPI/WorkPlusAPI.csproj -c Release -o ./publish
            elif [ -f "WorkPlusAPI.csproj" ]; then
              dotnet publish WorkPlusAPI.csproj -c Release -o ./publish
            else
              echo "Error: WorkPlusAPI.csproj not found!"
              exit 1
            fi
            
            # Restart backend process using PM2
            pm2 delete layerbiz-workplus-api || true
            pm2 start "dotnet ./publish/WorkPlusAPI.dll --urls=http://localhost:5000" --name "layerbiz-workplus-api"
            pm2 save
