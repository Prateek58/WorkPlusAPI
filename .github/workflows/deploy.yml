name: Deploy Backend API to CloudPanel

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore WorkPlusAPI.sln

      - name: Build and Publish .NET API
        run: dotnet publish WorkPlusAPI/WorkPlusAPI.csproj -c Release -o ./publish

      - name: Copy published files to Server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SITE_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          source: "./publish/*"
          target: "~/htdocs/api.workplus.layerbiz.com"
          strip_components: 1
          rm: false

      - name: Restart PM2 process on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SITE_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            
            cd ~/htdocs/api.workplus.layerbiz.com
            pm2 delete layerbiz-workplus-api || true
            fuser -k 5000/tcp || true
            pm2 start "dotnet WorkPlusAPI.dll --urls=http://localhost:5000" --name "layerbiz-workplus-api"
            pm2 save
